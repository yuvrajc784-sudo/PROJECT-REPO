<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media.css">
</head>

<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <a href="https://www.amazon.com/" target="_blank">
                    <div class="logo"></div>
                </a>
            </div>
            <div class="nav-address border">
                <p class="address-1">Deliver to</p>
                <div class="address-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="address-2">India</p>
                </div>
            </div>

            <div class="searchbar">
                <select class="search-select">
                    <option value="ALL">All</option>
                    <option value="Phones">Phones</option>
                    <option value="Furniture">Furniture</option>
                </select>
                <input type="text" placeholder="Search Amazon">
                <div class="search-logo">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="nav-lang border"><select class="lang">
                    <option value="">ENGLISH</option>
                    <option value="">ENGLISH</option>
                    <option value="">ENGLISH</option>
                </select></div>
            <div class="nav-signin border">
                <span class="line1">Hello, sign in</span>
                <div class="line2">Account & Lists</div>
            </div>

            <div class="nav-order border">
                <span class="line1">Returns</span>
                <div class="line2">& Orders</div>
            </div>
            <div class="nav-cart border">
                <i class="fa-solid fa-cart-arrow-down cartlogo"></i>
                <span class="line2">
                    Cart
                </span>
            </div>

        </div>
        <div class="panel">
         <div class="panel-all"><i class="fa-solid fa-bars">All</i></div>
            <div class="panel-ops">
                <p class="border2">Customer Service</p>
                <p class="border2">Gift Card</p>
                <p class="border2">Today's Deals</p>
                <p class="border2">Registry</p>
                <p class="border2">Prime Video</p>
                <p class="border2">Sell</p>

        </div>

    </header>
    <footer>

    </footer>
</body>

</html>
